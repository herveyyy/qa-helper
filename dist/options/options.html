<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faye Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body class="min-h-screen bg-neutral-50 text-neutral-900 antialiased">
    <main class="mx-auto max-w-lg px-6 py-10">
      <header class="mb-8 flex items-center gap-3">
        <img
          id="preview"
          src="../assets/giya-icon.png"
          alt="Faye icon preview"
          class="h-12 w-12 rounded-xl object-cover shadow-md"
        />
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">Faye Options</h1>
          <p class="text-sm text-neutral-600">Icon and sites where the widget appears.</p>
        </div>
      </header>

      <section class="mb-6 space-y-4 rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">
        <div>
          <h2 class="text-sm font-semibold">Allowed sites</h2>
          <p class="mt-1 text-xs text-neutral-500">
            Widget only mounts on matching hosts (not Gmail, etc.). Default
            <code class="rounded bg-neutral-100 px-1">wela.dev</code> covers
            <code class="rounded bg-neutral-100 px-1">*.wela.dev</code>. Also:
            <code class="rounded bg-neutral-100 px-1">livro.systems</code>,
            <code class="rounded bg-neutral-100 px-1">https://erp.livro.systems</code>.
          </p>
        </div>

        <ul id="origins-list" class="space-y-2"></ul>

        <div class="flex gap-2">
          <input
            id="origin-input"
            type="text"
            placeholder="e.g. wela.dev or https://app.example.com"
            class="min-w-0 flex-1 rounded-lg border border-neutral-300 px-3 py-2 text-sm outline-none ring-neutral-900 focus:ring-2"
          />
          <button
            id="origin-add"
            type="button"
            class="shrink-0 rounded-lg bg-neutral-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-neutral-800"
          >
            Add
          </button>
        </div>

        <button
          id="origins-reset"
          type="button"
          class="text-xs font-medium text-neutral-600 underline-offset-2 hover:underline"
        >
          Reset to default (wela.dev)
        </button>
      </section>

      <section class="space-y-6 rounded-2xl border border-neutral-200 bg-white p-6 shadow-sm">
        <label class="block space-y-2">
          <span class="text-sm font-medium">Upload icon</span>
          <input
            id="file"
            type="file"
            accept="image/*"
            class="block w-full text-sm text-neutral-700 file:mr-3 file:rounded-md file:border-0 file:bg-neutral-900 file:px-3 file:py-2 file:text-sm file:font-medium file:text-white hover:file:bg-neutral-800"
          />
        </label>

        <label class="block space-y-2">
          <span class="text-sm font-medium">Or icon URL</span>
          <input
            id="url"
            type="url"
            placeholder="https://example.com/icon.png"
            class="w-full rounded-lg border border-neutral-300 px-3 py-2 text-sm outline-none ring-neutral-900 focus:ring-2"
          />
        </label>

        <div class="flex flex-wrap gap-3">
          <button
            id="save-url"
            type="button"
            class="rounded-lg bg-neutral-900 px-4 py-2 text-sm font-medium text-white transition hover:bg-neutral-800"
          >
            Save URL
          </button>
          <button
            id="reset"
            type="button"
            class="rounded-lg border border-neutral-300 bg-white px-4 py-2 text-sm font-medium text-neutral-800 transition hover:bg-neutral-50"
          >
            Reset icon
          </button>
        </div>

        <p id="status" class="min-h-5 text-sm text-neutral-600" role="status"></p>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
